<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#7a0033" />
    <title>troBar</title>

    <!--
      Estils crítics inline: el navegador els aplica ABANS de baixar el bundle JS.
      Així evitem el "flash blanc" entre que es carrega l'HTML i React munta el splash.
    -->
    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #7a0033; /* Grana compartit amb brandColors.json */
      }
      body { overflow: hidden; }
      #root { display: flex; flex-direction: column; }

      /* Pantalla de càrrega estàtica (apareix immediatament, sense esperar React) */
      .splash-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #7a0033;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      .splash-gif {
        width: 200px;
        height: 200px;
        margin-bottom: 2px;
        border-radius: 100px;
        object-fit: contain;
      }

      .splash-wordmark {
        width: 252px;
        height: 90px;
        margin-top: -8px;
        margin-bottom: 12px;
        visibility: hidden;
      }
      .splash-overlay[data-logo-ready="true"] .splash-wordmark { visibility: visible; }
    </style>

    <link rel="preload" as="image" href="/brand/wordmark-cream.svg" />

    <!--
      Precarrega el GIF per renderitzar-lo més ràpidament.
    -->
    <link rel="preload" as="image" href="/gif/trobar.gif" />
  </head>
  <body>
    <noscript>Aquesta aplicació requereix JavaScript.</noscript>

    <!-- Pantalla estàtica de càrrega (GIF + text curvat) — apareix instantàniament -->
    <div class="splash-overlay" id="splash-static">
      <img src="/gif/trobar.gif" alt="troBar" class="splash-gif" onload="this.parentElement.dataset.logoReady='true'" onerror="console.error('troBar animated logo failed to load')" />
      <img class="splash-wordmark" src="/brand/wordmark-cream.svg" alt="" aria-hidden="true" width="252" height="90" />
    </div>

    <!-- Contenidor on React muntarà l'app -->
    <div id="root"></div>

    <script>
      function removeSplashStatic() {
        const splash = document.getElementById('splash-static');
        if (splash) {
          splash.style.display = 'none';
        }
      }

      window.removeSplashStatic = removeSplashStatic;

    </script>
    <!-- Expo Metro web injecta aquí el bundle automàticament -->
  </body>
</html>
